[tool.poetry]
name = "aurix-api"
version = "1.0.0"
description = "FastAPI backend for Aurix Desktop App"
authors = ["Aurix Team"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
deepgram-sdk = "^3.5.0"
groq = "^0.11.0"
cohere = "^5.9.0"
qdrant-client = "^1.11.0"
python-dotenv = "^1.0.1"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
